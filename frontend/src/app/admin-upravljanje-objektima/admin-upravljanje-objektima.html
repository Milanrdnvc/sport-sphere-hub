<div class="container mt-4">
  <h2 class="fw-bold text-dark mb-4">Objekti na cekanju</h2>

  @for (o of objektiNaCekanju; track o._id) {
    <div class="card mb-3 border-0 shadow-sm">
      <div class="card-body bg-light p-4">
        <div class="row align-items-center">
          <div class="col-md-8">
            <label class="form-label fw-semibold text-muted small d-block">Naziv objekta:</label>
            <span class="fw-bold text-dark fs-5">{{ o.naziv }}</span>
          </div>

          <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <button class="btn btn-primary btn-sm px-4 fw-semibold me-2" (click)="odobri(o._id)">
              Odobri
            </button>
            <button class="btn btn-outline-primary btn-sm px-4 fw-semibold" (click)="odbij(o._id)">
              Odbij
            </button>
          </div>
        </div>
      </div>
    </div>
  }
</div>
