<div class="container mt-4 mb-5">
  <h2 class="fw-bold text-dark mb-4">Analitika i statistika</h2>

  <div class="row g-4">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm p-4">
        <h5 class="fw-bold text-secondary mb-3">Broj odigranih termina po sportu</h5>
        <div style="position: relative; height: 300px">
          <canvas id="sportoviChart"></canvas>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card border-0 shadow-sm p-4">
        <h5 class="fw-bold text-secondary mb-3">Potrosnja na opremu po sportu (€)</h5>
        <div style="position: relative; height: 300px">
          <canvas id="opremaChart"></canvas>
        </div>
      </div>
    </div>

    <div class="col-12">
      <div class="card border-0 shadow-sm p-4">
        <h5 class="fw-bold text-secondary mb-3">Mesecni pregled aktivnosti</h5>
        <div style="position: relative; height: 350px">
          <canvas id="trendChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
