<div class="container mt-4">
  <div class="card mb-4 border-0 shadow-sm">
    <div class="card-header bg-white py-3 border-0">
      <h4 class="mb-0 fw-bold text-dark">Pretraga sportskih objekata</h4>
    </div>
    <div class="card-body bg-light border-top">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label fw-semibold text-muted small">Naziv objekta</label>
          <input
            type="text"
            class="form-control form-control-sm"
            placeholder="Unesite naziv..."
            [(ngModel)]="unetNaziv"
            (ngModelChange)="pretrazi()"
          />
        </div>

        <div class="col-md-2">
          <label class="form-label fw-semibold text-muted small">Grad</label>
          <select
            class="form-select form-select-sm"
            [(ngModel)]="izabraniGrad"
            (ngModelChange)="pretrazi()"
          >
            <option value="">Svi gradovi</option>
            @for (g of gradovi; track g) {
              <option [value]="g">{{ g }}</option>
            }
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label fw-semibold text-muted small">Sport</label>
          <select
            class="form-select form-select-sm"
            [(ngModel)]="izabraniSport"
            (ngModelChange)="pretrazi()"
          >
            <option value="">Svi sportovi</option>
            @for (s of sportovi; track s) {
              <option [value]="s">{{ s }}</option>
            }
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label fw-semibold text-muted small">Tip terena</label>
          <select
            class="form-select form-select-sm"
            [(ngModel)]="izabraniTipTerena"
            (ngModelChange)="pretrazi()"
          >
            <option value="">Svi tipovi</option>
            <option value="otvoreni_teren">Otvoreni</option>
            <option value="zatvorena_hala">Zatvoreni</option>
          </select>
        </div>

        <div class="col-md-3">
          <div class="form-check pb-1">
            <input
              type="checkbox"
              class="form-check-input"
              id="slobodnoDanasCheck"
              [(ngModel)]="slobodnoDanas"
              (ngModelChange)="pretrazi()"
            />
            <label
              class="form-check-label fw-semibold text-dark small"
              style="cursor: pointer"
              for="slobodnoDanasCheck"
            >
              Samo slobodni termini danas
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card mb-4 border-0 shadow-sm">
    <div class="card-header bg-white py-3 border-0">
      <h5 class="mb-0 fw-bold">Dostupni objekti</h5>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Naziv</th>
              <th>Grad</th>
              <th>Adresa</th>
              <th>Akcija</th>
            </tr>
          </thead>
          <tbody>
            @for (o of aktivniSportskiObjektiFiltrirani; track o.detalji_objekta._id) {
              <tr>
                <td>{{ o.detalji_objekta.naziv }}</td>
                <td>{{ o.detalji_objekta.grad }}</td>
                <td>{{ o.detalji_objekta.adresa }}</td>
                <td>
                  <button class="btn btn-primary btn-sm fw-semibold px-3" (click)="detalji(o)">
                    Detalji
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
