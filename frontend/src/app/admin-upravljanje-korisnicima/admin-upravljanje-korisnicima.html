<div class="container mt-4">
  <h2 class="fw-bold text-dark mb-4">Pregled i izmena korisnika</h2>

  @for (k of sviKorisnici; track k._id) {
    <div class="card mb-4 border-0 shadow-sm">
      <div class="card-body bg-light p-4">
        <div class="row g-4 align-items-center">
          <div class="col-md-3 text-center border-end pe-md-4">
            <div class="mb-3">
              <img
                [src]="'http://localhost:4000' + k.pfp"
                [alt]="k.pfp"
                class="rounded-circle shadow-sm"
                style="width: 120px; height: 120px; object-fit: cover"
              />
            </div>
            <button
              class="btn btn-outline-primary btn-sm fw-semibold w-100"
              (click)="resetujPfp(k._id)"
            >
              Resetuj profilnu sliku
            </button>
          </div>

          <div class="col-md-9">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label fw-semibold text-muted small">Korisnicko ime:</label>
                <input
                  type="text"
                  class="form-control form-control-sm bg-white"
                  placeholder="Korisnicko ime"
                  disabled
                  [value]="k.kor_ime"
                />
              </div>

              <div class="col-md-4">
                <label class="form-label fw-semibold text-muted small">Ime:</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  placeholder="Ime"
                  [(ngModel)]="k.ime"
                />
              </div>

              <div class="col-md-4">
                <label class="form-label fw-semibold text-muted small">Prezime:</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  placeholder="Prezime"
                  [(ngModel)]="k.prezime"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold text-muted small">E-mail:</label>
                <input
                  type="email"
                  class="form-control form-control-sm"
                  placeholder="E-mail"
                  [(ngModel)]="k.email"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold text-muted small">Kontakt telefon:</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  placeholder="Kontakt telefon"
                  [(ngModel)]="k.kontakt_telefon"
                />
              </div>

              <div class="col-md-12">
                <label class="form-label fw-semibold text-muted small d-block"
                  >Omiljeni sportovi:</label
                >
                <div class="mb-2">
                  @for (s of k.sportovi; track s) {
                    <span class="badge bg-primary me-1 py-1 px-2 fw-semibold">{{ s }}</span>
                  }
                </div>
                <select
                  class="form-select form-select-sm"
                  multiple
                  [(ngModel)]="k.sportovi"
                  (ngModelChange)="proveriLimitSportova($event, k)"
                >
                  @for (s of dostupniSportovi; track s.naziv) {
                    <option [value]="s.naziv">{{ s.naziv }}</option>
                  }
                </select>
              </div>
            </div>
          </div>

          <div
            class="col-md-12 text-end border-top pt-3 mt-3 d-flex align-items-center justify-content-between"
          >
            <div>
              @if (errMsgAzuriranje[k._id]) {
                <span class="text-danger small fw-semibold">{{ errMsgAzuriranje[k._id] }}</span>
              }
            </div>
            <div>
              <button
                class="btn btn-primary btn-sm px-4 fw-semibold me-2"
                (click)="azurirajProfil(k)"
              >
                Azuriraj profil
              </button>
              <button
                class="btn btn-outline-primary btn-sm px-4 fw-semibold"
                (click)="obrisiNalog(k._id)"
              >
                Obrisi nalog
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
