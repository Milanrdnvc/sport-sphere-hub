<div class="container mt-4">
  <div class="card p-4 border-0 shadow-sm bg-light">
    @if (errMsg) {
      <div
        class="alert alert-danger d-flex align-items-center mb-4 border-0 shadow-sm"
        role="alert"
      >
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <div class="fw-semibold">{{ errMsg }}</div>
      </div>
    }
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Izaberite objekat:</label>
        <select class="form-select form-select-sm" [(ngModel)]="izabranObjekat">
          @for (o of sviAktivniObjektiZaZaposlenog; track o.detalji_objekta._id) {
            <option [ngValue]="o.detalji_objekta._id">{{ o.detalji_objekta.naziv }}</option>
          }
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label fw-semibold small">Izaberite mesec:</label>
        <input type="month" class="form-control form-control-sm" [(ngModel)]="izabraniMesec" />
      </div>

      <div class="col-md-3">
        <button class="btn btn-primary btn-sm w-100 fw-semibold" (click)="preuzmiPopunjenost()">
          Izveštaj o popunjenosti
        </button>
      </div>

      <div class="col-md-3">
        <button
          class="btn btn-primary btn-sm w-100 fw-semibold text-white"
          (click)="preuzmiPromet()"
        >
          Izveštaj o prometu opreme
        </button>
      </div>
    </div>
  </div>
</div>
